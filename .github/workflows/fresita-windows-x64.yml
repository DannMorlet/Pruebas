name: Fresita Studio x64
on:
  push:
    branches: [feature/fresita-studio]
    paths:
      - 'FresitaStudio/**'
      - '.github/workflows/fresita-windows-x64.yml'
  pull_request:
    paths:
      - 'FresitaStudio/**'
      - '.github/workflows/fresita-windows-x64.yml'
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: FresitaStudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Pruebas sin CUDA
        shell: pwsh
        run: |
          python -c "import struct; assert struct.calcsize('P') == 8"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import workers.train_lora; print('Worker importado sin cargar CUDA')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Construir Fresita.exe
        shell: pwsh
        run: |
          python -m pip install "pyinstaller>=6.15,<7"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Fresita --add-data "workers;workers" --add-data "fresita_core.py;." --add-data "fresita_metrics.py;." fresita.py
          if (!(Test-Path dist/Fresita.exe)) { throw "Fresita.exe ausente" }
      - name: Comprobar arquitectura x64
        shell: pwsh
        run: |
          @'
          import pathlib,struct
          b=pathlib.Path("dist/Fresita.exe").read_bytes()
          pe=struct.unpack_from("<I",b,0x3c)[0]
          assert b[pe:pe+4] == b"PE\x00\x00"
          assert struct.unpack_from("<H",b,pe+4)[0] == 0x8664
          assert struct.unpack_from("<H",b,pe+24)[0] == 0x20b
          print("EXE nativo PE32+ AMD64 verificado")
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: Fresita-Windows-x64
          path: FresitaStudio/dist/Fresita.exe
          retention-days: 14
          if-no-files-found: error
